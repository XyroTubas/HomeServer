services:

  db:
    image: mariadb:11.8
    container_name: nextcloud-db
    restart: unless-stopped
    command:
      - --transaction-isolation=READ-COMMITTED
      - --binlog-format=ROW
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - /opt/docker/nextcloud/db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: nextcloud:34-apache
    container_name: nextcloud
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    environment:
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
      MYSQL_HOST: db

      REDIS_HOST: redis

      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}

      NEXTCLOUD_DATA_DIR: /var/www/html/data
      NEXTCLOUD_TRUSTED_DOMAINS: ${TS_DNS}

      OVERWRITEHOST: ${TS_DNS}
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://${TS_DNS}

      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_LIMIT: 16G
      APACHE_BODY_LIMIT: 17179869184
      NEXTCLOUD_INIT_HTACCESS: "true"

    volumes:
      - /opt/docker/nextcloud/html:/var/www/html
      - type: bind
        source: /mnt/nextcloud/data
        target: /var/www/html/data
        bind:
          create_host_path: false

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  cron:
    image: nextcloud:34-apache
    container_name: nextcloud-cron
    restart: unless-stopped
    entrypoint: /cron.sh

    volumes:
      - /opt/docker/nextcloud/html:/var/www/html
      - type: bind
        source: /mnt/nextcloud/data
        target: /var/www/html/data
        bind:
          create_host_path: false

    depends_on:
      - app
